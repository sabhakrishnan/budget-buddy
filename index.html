<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e17" />
  <title>Budget Buddy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Budget Buddy" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- SheetJS for Excel import/export (cached by the service worker after first online load) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
          integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"
          crossorigin="anonymous" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="month-nav">
      <button id="prevMonth" class="icon-btn" aria-label="Previous month">‹</button>
      <div class="month-label">
        <span id="monthTitle">Month</span>
        <small id="monthSub"></small>
      </div>
      <button id="nextMonth" class="icon-btn" aria-label="Next month">›</button>
    </div>
  </header>

  <main id="view" class="view"><!-- rendered by app.js --></main>

  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab active" data-tab="dashboard">
      <span class="tab-ico">📊</span><span>Home</span>
    </button>
    <button class="tab" data-tab="month">
      <span class="tab-ico">🗓️</span><span>Month</span>
    </button>
    <button class="tab" data-tab="setup">
      <span class="tab-ico">⚙️</span><span>Setup</span>
    </button>
    <button class="tab" data-tab="data">
      <span class="tab-ico">💾</span><span>Data</span>
    </button>
  </nav>

  <script src="js/app.js" defer></script>
</body>
</html>
